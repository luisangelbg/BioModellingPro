    let z = 'M-4 -76 '; for (let i = 0; i < 4; i++) z += `q ${i % 2 ? 9 : -9} -6 0 -12 `;

    el('path', { d: 'M4 -74 C26 -84 44 -76 48 -58 C32 -50 12 -56 4 -74 Z', fill: linear('gHojaCh', [['0%', '#c6e08a'], ['100%', '#6f9c30']]), stroke: '#4d7020', 'stroke-width': 0.8 }, g);
    return g;
  }

  /* ---------------------------------------------------------------- maracuyá: flor y fruto */
  function maracuya(x, y, s, rot) {
    const g = gr(x, y, s, rot);
    /* fruto detrás, a la derecha */
    const piel = radial('gMaracuya', [['0%', '#c79ad8'], ['35%', '#7e3d9e'], ['80%', '#4d1f68'], ['100%', '#331246']], { r: '60%', fx: '32%', fy: '26%' });
    const gf = el('g', { transform: 'translate(44 34)' }, g);
    el('ellipse', { cx: 0, cy: 0, rx: 26, ry: 27, fill: piel, stroke: '#2c1040', 'stroke-width': 0.9 }, gf);
    el('ellipse', { cx: -9, cy: -10, rx: 7.5, ry: 5, fill: '#ffffff', opacity: 0.3, transform: 'rotate(-28 -9 -10)' }, gf);
    el('path', { d: 'M0 -27 C2 -33 0 -38 -4 -42', fill: 'none', stroke: '#6b8f34', 'stroke-width': 2.4, 'stroke-linecap': 'round' }, gf);
    /* flor */
    const fl = el('g', { transform: 'translate(-14 -8)' }, g);
    const tepalo = linear('gTepalo', [['0%', '#ffffff'], ['70%', '#f3eaf8'], ['100%', '#d8c6e6']]);
    for (let i = 0; i < 10; i++) {
      const a = i * 36 + 9;
      el('ellipse', { cx: 0, cy: 0, rx: 46, ry: 8.5, fill: tepalo, stroke: '#b9a3cb', 'stroke-width': 0.6,
        transform: `rotate(${a}) translate(30 0)` }, fl);
    }
    /* corona de filamentos: morado en la base, blanco en la punta */
    for (let i = 0; i < 72; i++) {
      const a = i * 5 + rng() * 2.2, L = 27 + rng() * 5;
      const x1 = Math.cos(rad(a)) * 7, y1 = Math.sin(rad(a)) * 7;
      const x2 = Math.cos(rad(a)) * L, y2 = Math.sin(rad(a)) * L;
      el('line', { x1, y1, x2, y2, stroke: '#5c2b85', 'stroke-width': 1.5, 'stroke-linecap': 'round' }, fl);
      el('line', { x1: x2 * 0.72, y1: y2 * 0.72, x2, y2, stroke: '#ffffff', 'stroke-width': 1.5, 'stroke-linecap': 'round' }, fl);
    }
    el('circle', { cx: 0, cy: 0, r: 9.5, fill: '#dff0d4', stroke: '#7ba53e', 'stroke-width': 0.8 }, fl);
    /* androginóforo: cinco estambres y tres estigmas */
    for (let i = 0; i < 5; i++) {
      const a = i * 72 + 18;
      const ex = Math.cos(rad(a)) * 15, ey = Math.sin(rad(a)) * 15;
      el('line', { x1: 0, y1: 0, x2: ex, y2: ey, stroke: '#8fae63', 'stroke-width': 1.4 }, fl);
      el('ellipse', { cx: ex, cy: ey, rx: 5, ry: 2.4, fill: '#e8c15a', stroke: '#a8822a', 'stroke-width': 0.5, transform: `rotate(${a} ${f1(ex)} ${f1(ey)})` }, fl);
    }
    for (let i = 0; i < 3; i++) {
      const a = i * 120 - 90;
      const ex = Math.cos(rad(a)) * 11, ey = Math.sin(rad(a)) * 11 - 4;
      el('line', { x1: 0, y1: -3, x2: ex, y2: ey, stroke: '#7ba53e', 'stroke-width': 1.6 }, fl);
      el('circle', { cx: ex, cy: ey, r: 2.6, fill: '#c7dc9a', stroke: '#6b8f34', 'stroke-width': 0.5 }, fl);
    }
    return g;
  }

  /* ---------------------------------------------------------------- abeja */
  function abeja(x, y, s, rot) {
    const g = gr(x, y, s, rot);
    const ala = radial('gAla', [['0%', '#ffffff'], ['100%', '#dbe6ee']], { r: '60%' });
    [[-6, -16, -34, 14], [2, -15, -22, 20]].forEach(([cx, cy, r1, r2], i) => {
      const a = el('ellipse', { cx, cy, rx: 21, ry: 8, fill: ala, opacity: 0.8, stroke: '#9fb4c4', 'stroke-width': 0.5, transform: `rotate(${i ? -20 : -44} ${cx} ${cy})` }, g);
      return a;
    });
    /* abdomen con bandas */
    el('clipPath', { id: 'clipAbd' }, defs).appendChild((() => { const e = document.createElementNS(NS, 'ellipse'); e.setAttribute('cx', 16); e.setAttribute('cy', 4); e.setAttribute('rx', 20); e.setAttribute('ry', 13); return e; })());
    el('ellipse', { cx: 16, cy: 4, rx: 20, ry: 13, fill: linear('gAbd', [['0%', '#f6cf62'], ['100%', '#d99a1c']]) }, g);
    const bandas = el('g', { 'clip-path': 'url(#clipAbd)' }, g);
    el('rect', { x: -6, y: -12, width: 46, height: 34, fill: '#f0b323' }, bandas);
    [2, 13, 24].forEach(bx => el('rect', { x: bx, y: -12, width: 6.5, height: 34, fill: '#2d2419' }, bandas));
    el('ellipse', { cx: 16, cy: 4, rx: 20, ry: 13, fill: 'none', stroke: '#2d2419', 'stroke-width': 0.9 }, g);
    /* tórax y cabeza */
    el('ellipse', { cx: -7, cy: 0, rx: 11, ry: 10, fill: '#6b5a3a' }, g);
    for (let i = 0; i < 26; i++) { const a = rng() * 360, r = 9 + rng() * 3.5; el('line', { x1: -7, y1: 0, x2: -7 + Math.cos(rad(a)) * r, y2: Math.sin(rad(a)) * r, stroke: '#8a7449', 'stroke-width': 0.8, 'stroke-linecap': 'round', opacity: 0.8 }, g); }
    el('circle', { cx: -22, cy: -1, r: 8, fill: '#2d2419' }, g);
    el('ellipse', { cx: -26, cy: -4, rx: 3.2, ry: 4.4, fill: '#5c5142', transform: 'rotate(-20 -26 -4)' }, g);
    el('path', { d: 'M-27 -8 C-33 -16 -37 -18 -42 -17', fill: 'none', stroke: '#2d2419', 'stroke-width': 1.5, 'stroke-linecap': 'round' }, g);
    el('path', { d: 'M-25 -9 C-29 -19 -32 -23 -37 -24', fill: 'none', stroke: '#2d2419', 'stroke-width': 1.5, 'stroke-linecap': 'round' }, g);
    [[-14, 9, -22, 20], [-6, 11, -8, 23], [2, 12, 6, 24]].forEach(([x1, y1, x2, y2]) =>
      el('path', { d: `M${x1} ${y1} Q${f1((x1 + x2) / 2 - 3)} ${f1((y1 + y2) / 2 + 3)} ${x2} ${y2}`, fill: 'none', stroke: '#2d2419', 'stroke-width': 1.5, 'stroke-linecap': 'round' }, g));
    return g;
  }

  /* ---------------------------------------------------------------- mariposa monarca */
  function mariposa(x, y, s, rot) {
    const g = gr(x, y, s, rot);
    const naranja = linear('gAlaM', [['0%', '#ffb347'], ['55%', '#f08a1c'], ['100%', '#d2630d']]);
    const ala = (sx) => {
      const a = el('g', { transform: `scale(${sx} 1)` }, g);
      el('path', { d: 'M2 -4 C16 -40 44 -52 56 -40 C64 -32 58 -12 38 -2 C26 4 10 6 2 -4 Z', fill: naranja, stroke: '#2b1a0b', 'stroke-width': 2.1, 'stroke-linejoin': 'round' }, a);
      el('path', { d: 'M2 2 C16 6 34 10 40 22 C44 32 34 42 22 40 C10 38 2 22 2 2 Z', fill: naranja, stroke: '#2b1a0b', 'stroke-width': 2.1, 'stroke-linejoin': 'round' }, a);
      /* venas */
      [[-30, 18], [-22, 30], [-10, 40], [4, 46]].forEach(([dy, dx]) => el('path', { d: `M4 -2 L${dx} ${dy}`, stroke: '#2b1a0b', 'stroke-width': 1.3, fill: 'none', opacity: 0.85 }, a));
      [[16, 24], [26, 18], [34, 8]].forEach(([dy, dx]) => el('path', { d: `M4 2 L${dx} ${dy}`, stroke: '#2b1a0b', 'stroke-width': 1.2, fill: 'none', opacity: 0.85 }, a));
      /* puntos blancos del margen */
      for (let i = 0; i < 7; i++) { const t = i / 6; el('circle', { cx: 52 - t * 16, cy: -40 + t * 42, r: 1.7, fill: '#ffffff' }, a); }
      for (let i = 0; i < 4; i++) { const t = i / 3; el('circle', { cx: 40 - t * 18, cy: 24 + t * 15, r: 1.5, fill: '#ffffff' }, a); }
      return a;
    };
    ala(1); ala(-1);
    el('ellipse', { cx: 0, cy: 6, rx: 3.4, ry: 22, fill: '#2b1a0b' }, g);
    el('circle', { cx: 0, cy: -18, r: 4.4, fill: '#2b1a0b' }, g);
    el('path', { d: 'M-2 -21 C-8 -32 -12 -36 -18 -37', fill: 'none', stroke: '#2b1a0b', 'stroke-width': 1.4, 'stroke-linecap': 'round' }, g);
    el('path', { d: 'M2 -21 C8 -32 12 -36 18 -37', fill: 'none', stroke: '#2b1a0b', 'stroke-width': 1.4, 'stroke-linecap': 'round' }, g);
    return g;
  }

  /* ---------------------------------------------------------------- rama de piñonero con cono */
  function pino(x, y, s, rot) {
    const g = gr(x, y, s, rot);
    el('path', { d: 'M-74 22 C-40 16 -6 8 26 0', fill: 'none', stroke: '#6b4a2a', 'stroke-width': 4.5, 'stroke-linecap': 'round' }, g);
    /* fascículos de tres acículas */
    for (let i = 0; i < 9; i++) {
      const t = i / 8, bx = -72 + t * 92, by = 21 - t * 20;
      const base = -52 - i * 2;
      for (let k = -1; k <= 1; k++) {
        const a = base + k * 17 + rng() * 4, L = 26 + rng() * 9;
        el('path', { d: `M${f1(bx)} ${f1(by)} Q${f1(bx + Math.cos(rad(a)) * L * 0.55)} ${f1(by + Math.sin(rad(a)) * L * 0.55 + 2)} ${f1(bx + Math.cos(rad(a)) * L)} ${f1(by + Math.sin(rad(a)) * L)}`, fill: 'none', stroke: mix('#2f6b4f', '#7fae74', rng() * 0.5), 'stroke-width': 1.5, 'stroke-linecap': 'round' }, g);
      }
    }
    /* cono: silueta ovada y escamas leñosas superpuestas, de abajo hacia arriba */
    const cono = el('g', { transform: 'translate(36 -4) rotate(14)' }, g);
    el('path', { d: 'M0 -34 C18 -34 26 -18 26 2 C26 22 16 34 0 34 C-16 34 -26 22 -26 2 C-26 -18 -18 -34 0 -34 Z', fill: '#6d421c' }, cono);
    const esc = linear('gEscama', [['0%', '#d9a361'], ['48%', '#a46a30'], ['100%', '#6b3d16']], { x1: 0, y1: 0, x2: 0, y2: 1 });
    const escala = (cx, cy, w, h) => {
      el('path', { d: `M${f1(cx - w)} ${f1(cy)} C${f1(cx - w)} ${f1(cy - h)} ${f1(cx + w)} ${f1(cy - h)} ${f1(cx + w)} ${f1(cy)}`
        + ` C${f1(cx + w * 0.72)} ${f1(cy + h * 0.62)} ${f1(cx - w * 0.72)} ${f1(cy + h * 0.62)} ${f1(cx - w)} ${f1(cy)} Z`,
        fill: esc, stroke: '#4a2c11', 'stroke-width': 0.7, 'stroke-linejoin': 'round' }, cono);
      el('path', { d: `M${f1(cx - w * 0.45)} ${f1(cy + h * 0.1)} L${f1(cx)} ${f1(cy - h * 0.42)} L${f1(cx + w * 0.45)} ${f1(cy + h * 0.1)}`,
        fill: 'none', stroke: '#f0d9b0', 'stroke-width': 0.6, opacity: 0.55 }, cono);
    };
    for (let fila = 5; fila >= 0; fila--) {
      const fy = 26 - fila * 10.5;
      const an = 24 * Math.sqrt(Math.max(0.05, 1 - Math.pow((fy - 2) / 36, 2)));
      const n = fila % 2 ? 3 : 4;
      for (let i = 0; i < n; i++) {
        const t = n > 1 ? i / (n - 1) * 2 - 1 : 0;
        escala(t * an * 0.74, fy, 8.2 * (1 - Math.abs(t) * 0.2), 9);
      }
    }
    el('ellipse', { cx: 0, cy: 33, rx: 4.6, ry: 3.6, fill: '#6b4a2a' }, cono);
    /* dos piñones */
    el('ellipse', { cx: -30, cy: 26, rx: 6, ry: 4.4, fill: '#d9c08a', stroke: '#9a7b3e', 'stroke-width': 0.6, transform: 'rotate(-18 -30 26)' }, g);
    el('ellipse', { cx: -18, cy: 32, rx: 6, ry: 4.4, fill: '#e6d2a6', stroke: '#9a7b3e', 'stroke-width': 0.6, transform: 'rotate(8 -18 32)' }, g);
    return g;
  }

  /* colocación alrededor del mapa */
  mariposa(114, 400, 0.44, 0);    rotulo(114, 440, 'Danaus plexippus', 'MONARCA');
  mazorca(114, 520, 0.55, -13);   rotulo(114, 584, 'Zea mays', 'MAÍZ');
  agave(114, 668, 0.55, 0);       rotulo(114, 696, 'Agave salmiana', 'MAGUEY');
  abeja(736, 398, 0.54, -18);     rotulo(736, 440, 'Apis mellifera', 'ABEJA');
  chayote(736, 528, 0.55, 8);     rotulo(736, 596, 'Sechium edule', 'CHAYOTE');
  maracuya(730, 668, 0.50, 0);    rotulo(736, 714, 'Passiflora edulis', 'MARACUYÁ');
  pino(600, 744, 0.68, 0);        rotulo(600, 792, 'Pinus cembroides', 'PIÑONERO');

  /* ============================================================ viñetas del programa */
  const VY = 806, VH = 132, VW = 168, VGAP = 15.5;
  const vinetas = [
    ['Capas ambientales', 'variables en cada punto', (p, w, h) => {
      const cols = 6, rows = 4, cw = 15, ch = 7.5, ox = 26, oy = 26;
      for (let k = 2; k >= 0; k--) {
        const dx = k * 9, dy = k * 15;
        const g2 = el('g', { transform: `translate(${ox + dx} ${oy + dy})`, opacity: 1 }, p);
        for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
          const v = (Math.sin(c * 0.9 + k * 1.7) + Math.cos(r * 1.1 - k)) * 0.25 + 0.5;
          const x = (c - r * 0.5) * cw, y = r * ch;
          el('path', { d: cerrar([[x, y], [x + cw, y], [x + cw - cw * 0.5, y + ch], [x - cw * 0.5, y + ch]]), fill: rampa(['#e8f1ee', SUIT[3], SUIT[6]], v), stroke: '#ffffff', 'stroke-width': 0.5 }, g2);
        }
      }
      el('line', { x1: 74, y1: 12, x2: 74, y2: 96, stroke: INK, 'stroke-width': 1.1, 'stroke-dasharray': '3 3' }, p);
      el('circle', { cx: 74, cy: 96, r: 3.4, fill: '#13312b' }, p);
      el('circle', { cx: 74, cy: 96, r: 6.4, fill: 'none', stroke: INK, 'stroke-width': 0.8, opacity: 0.5 }, p);
    }],
    ['Curva de respuesta', 'dónde vive la especie', (p) => {
      el('path', { d: 'M18 96 L150 96 M18 96 L18 16', fill: 'none', stroke: TINTA, 'stroke-width': 1 }, p);
      const pts = [];
      for (let i = 0; i <= 60; i++) { const x = 18 + i * 2.2, t = (i - 30) / 15; pts.push([x, 92 - 68 * Math.exp(-0.5 * t * t)]); }
      el('path', { d: poly(pts) + ` L150 96 L18 96 Z`, fill: SUIT[3], opacity: 0.5 }, p);
      el('path', { d: poly(pts), fill: 'none', stroke: '#1d6153', 'stroke-width': 2.2 }, p);
      el('line', { x1: 84, y1: 24, x2: 84, y2: 96, stroke: '#b7791f', 'stroke-width': 1.2, 'stroke-dasharray': '3 3' }, p);
      txt(84, 110, 'óptimo', { sans: true, size: 7.5, color: GRIS, ancla: 'middle', padre: p });
    }],
    ['Curva ROC', 'qué tan bien predice', (p) => {
      el('path', { d: 'M18 96 L150 96 M18 96 L18 16', fill: 'none', stroke: TINTA, 'stroke-width': 1 }, p);
      el('line', { x1: 18, y1: 96, x2: 142, y2: 20, stroke: GRIS, 'stroke-width': 1, 'stroke-dasharray': '3 3' }, p);
      const roc = [];
      for (let i = 0; i <= 40; i++) { const t = i / 40; roc.push([18 + t * 124, 96 - (1 - Math.pow(1 - t, 2.9)) * 76]); }
      el('path', { d: poly(roc) + ' L142 96 Z', fill: SUIT[4], opacity: 0.32 }, p);
      el('path', { d: poly(roc), fill: 'none', stroke: '#2b6fb3', 'stroke-width': 2.2 }, p);
      txt(96, 78, 'AUC', { sans: true, size: 9, peso: 500, color: '#1d5bb0', ancla: 'middle', padre: p });
    }],
    ['Rarefacción', 'cuántas especies faltan', (p) => {
      el('path', { d: 'M18 96 L150 96 M18 96 L18 16', fill: 'none', stroke: TINTA, 'stroke-width': 1 }, p);
      const cur = [];
      for (let i = 0; i <= 40; i++) { const t = i / 40; cur.push([18 + t * 124, 96 - 70 * (1 - Math.exp(-3.1 * t))]); }
      el('path', { d: poly(cur), fill: 'none', stroke: '#7e3fb0', 'stroke-width': 2.2 }, p);
      /* banda de confianza */
      const arriba = cur.map(([x, y]) => [x, y - 5 - (x - 18) * 0.045]), abajo = cur.map(([x, y]) => [x, y + 5 + (x - 18) * 0.045]).reverse();
      el('path', { d: poly(arriba.concat(abajo)) + 'Z', fill: '#7e3fb0', opacity: 0.16 }, p);
      el('line', { x1: 18, y1: 26, x2: 150, y2: 26, stroke: GRIS, 'stroke-width': 1, 'stroke-dasharray': '3 3' }, p);
      txt(148, 22, 'riqueza estimada', { sans: true, size: 7.5, color: GRIS, ancla: 'end', padre: p });
    }],
  ];
  vinetas.forEach(([titulo, pie, dibujo], i) => {
    const vx = 68 + i * (VW + VGAP);
    el('rect', { x: vx, y: VY, width: VW, height: VH, fill: '#fbfcfb', stroke: '#d7e1dc', 'stroke-width': 1, rx: 5 });
    el('rect', { x: vx, y: VY, width: VW, height: 3, fill: BLOQUES[[5, 9, 9, 8][i]], rx: 1.5 });
    const p = el('g', { transform: `translate(${vx} ${VY + 6}) scale(0.86)` });
    dibujo(p, VW, VH);
    txt(vx + VW / 2, VY + VH - 20, titulo, { size: 13, peso: 600, color: TINTA, ancla: 'middle' });
    txt(vx + VW / 2, VY + VH - 8, pie, { sans: true, size: 8, color: GRIS, ancla: 'middle' });
  });

  /* ============================================================ pie */
  const FY = 968;
  BLOQUES.forEach((c, i) => el('rect', { x: 68 + i * 65, y: FY, width: 61, height: 7, fill: c, rx: 1.5 }));
  el('rect', { x: 68, y: FY + 24, width: 714, height: 1.2, fill: '#c9d6cf' });
  txt(68, FY + 50, 'Luis Ángel Barrera-Guzmán · Gabriela Ramírez-Ojeda · Jorge Cadena-Iñiguez', { size: 15.5, peso: 600, color: TINTA });
  txt(68, FY + 70, 'Daniel Alejandro Cadena-Zamudio · Jorge David Cadena-Zamudio · Héctor Tecumshé Mojica-Zárate', { size: 15.5, peso: 600, color: TINTA });
  txt(68, FY + 90, '2026 · LICENCIA GPL-3.0 O POSTERIOR', { sans: true, size: 8.5, esp: '0.1em', color: GRIS });
  txt(782, FY + 90, 'Diez pasos, de los registros al mapa', { size: 14, cursiva: true, color: INK, ancla: 'end' });
})();
</script>
